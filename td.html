  {type: "EXTREME TRUTH", text: "Tell the truth about every person you've fantasized about while with your current partner."},
  {type: "EXTREME DARE", text: "Pleasure yourself to completion while your partner films and directs - they control everything."},
  {type: "EXTREME TRUTH", text: "Describe the most shameful thing that turns you on - be completely honest."},
  {type: "EXTREME DARE", text: "Let your partner mark your body in a visible place that will last for days."},
  {type: "EXTREME TRUTH", text: "Admit something you've never told your partner that could change everything."},
  {type: "EXTREME DARE", text: "Beg your partner to degrade you and use you however they see fit."},
  {type: "EXTREME TRUTH", text: "Confess who in your life you'd cheat with if there were no consequences."},
  {type: "EXTREME DARE", text: "Orgasm exactly when your partner tells you to - failure means punishment."},
  {type: "EXTREME TRUTH", text: "Tell the complete truth about your body count and your wildest encounters."},
  {type: "EXTREME DARE", text: "Submit to public play - do something risky where you might get caught."},
];

// === WILDCARD BONUSES ===
const wildcardBonuses = [
  {title: "🎲 DOUBLE DOWN", text: "Complete this challenge AND the next one for double heat!"},
  {title: "🔥 HEAT WAVE", text: "This challenge is worth TRIPLE heat points!"},
  {title: "👥 BOTH PLAYERS", text: "Both of you must complete this challenge together!"},
  {title: "⏰ SPEED ROUND", text: "You have half the normal time - GO!"},
  {title: "🎭 ROLE REVERSAL", text: "Switch players - the other person does this!"},
  {title: "💎 JACKPOT", text: "Complete this for an instant +50 heat points!"},
  {title: "⭐ WILD CHOICE", text: "You get to choose: Truth or Dare!"},
  {title: "🎁 FREE PASS", text: "You can skip this with no penalty!"},
];

// === GAME STATE ===
let player1Name = 'Player 1';
let player2Name = 'Player 2';
let currentPlayerIndex = 0;
let roundCount = 1;
let completedCount = 0;
let isSpinning = false;
let usedTruths = [];
let usedDares = [];
let usedExtremes = [];

// === SETUP ===
document.getElementById('startBtn').addEventListener('click', () => {
  const p1 = document.getElementById('player1Name').value.trim();
  const p2 = document.getElementById('player2Name').value.trim();

  player1Name = p1 || 'Player 1';
  player2Name = p2 || 'Player 2';

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';

  updateCurrentPlayer();
  createParticles('🌙', 20);
});

function updateCurrentPlayer() {
  const playerName = currentPlayerIndex === 0 ? player1Name : player2Name;
  document.getElementById('currentPlayerName').textContent = playerName;
}

// === SPIN WHEEL ===
document.getElementById('spinBtn').addEventListener('click', spinWheel);

function spinWheel() {
  if (isSpinning) return;

  isSpinning = true;
  document.getElementById('spinBtn').disabled = true;

  const wheel = document.getElementById('wheel');
  wheel.classList.add('spinning');

  // Random spins between 5-10 full rotations + random position
  const baseRotation = 360 * (5 + Math.floor(Math.random() * 6));
  const sections = [0, 90, 180, 270]; // Truth, Dare, Extreme, Wildcard
  const landingSection = sections[Math.floor(Math.random() * sections.length)];
  const finalRotation = baseRotation + landingSection;

  wheel.style.transform = `rotate(${finalRotation}deg)`;

  createParticles('🎰', 30);

  setTimeout(() => {
    wheel.classList.remove('spinning');
    isSpinning = false;

    // Determine what was landed on (accounting for pointer at top)
    const normalizedAngle = (360 - (finalRotation % 360)) % 360;
    let result;

    if (normalizedAngle >= 315 || normalizedAngle < 45) {
      result = 'truth';
    } else if (normalizedAngle >= 45 && normalizedAngle < 135) {
      result = 'dare';
    } else if (normalizedAngle >= 135 && normalizedAngle < 225) {
      result = 'extreme';
    } else {
      result = 'wildcard';
    }

    showChallenge(result);
  }, 4000);
}

function getRandomUnused(array, usedArray) {
  // If all have been used, reset
  if (usedArray.length >= array.length) {
    usedArray.length = 0;
  }

  // Get available items
  let available = array.filter((item, index) => !usedArray.includes(index));

  // Pick random from available
  const randomItem = available[Math.floor(Math.random() * available.length)];
  const originalIndex = array.indexOf(randomItem);

  // Mark as used
  usedArray.push(originalIndex);

  return randomItem;
}

function showChallenge(type) {
  let challenge;
  const playerName = currentPlayerIndex === 0 ? player1Name : player2Name;

  if (type === 'wildcard') {
    // Wildcard bonus
    const wildcard = wildcardBonuses[Math.floor(Math.random() * wildcardBonuses.length)];
    alert(`🌟 WILDCARD! 🌟\n\n${wildcard.title}\n${wildcard.text}`);
    createParticles('⭐', 50);

    // After wildcard, spin again
    document.getElementById('spinBtn').disabled = false;
    return;
  } else if (type === 'extreme') {
    challenge = getRandomUnused(extremeChallenges, usedExtremes);
  } else if (type === 'truth') {
    challenge = {
      type: 'TRUTH',
      text: getRandomUnused(allTruths, usedTruths)
    };
  } else {
    challenge = {
      type: 'DARE',
      text: getRandomUnused(allDares, usedDares)
    };
  }

  displayChallenge(challenge, playerName);
}

function displayChallenge(challenge, playerName) {
  document.getElementById('wheelContainer').style.display = 'none';
  document.getElementById('challengeDisplay').style.display = 'block';
  document.getElementById('challengeType').textContent = challenge.type;
  document.getElementById('challengeText').textContent = challenge.text;
  document.getElementById('challengePlayer').textContent = `${playerName}'s Challenge`;

  document.getElementById('completeBtn').style.display = 'inline-block';
  document.getElementById('skipBtn').style.display = 'inline-block';
  document.getElementById('spinBtn').style.display = 'none';

  createParticles(challenge.type.includes('EXTREME') ? '💥' : challenge.type.includes('TRUTH') ? '💙' : '💜', 25);
}

// === COMPLETE/SKIP ===
document.getElementById('completeBtn').addEventListener('click', () => {
  completedCount++;
  updateStats();
  createParticles('✨', 30);

  document.getElementById('completeBtn').style.display = 'none';
  document.getElementById('skipBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
});

document.getElementById('skipBtn').addEventListener('click', () => {
  const playerName = currentPlayerIndex === 0 ? player1Name : player2Name;
  alert(`🍺 ${playerName} DRINKS! 🍺\n\nPENALTY: Take a drink for refusing the challenge!`);
  createParticles('🍺', 30);

  document.getElementById('completeBtn').style.display = 'none';
  document.getElementById('skipBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
});

document.getElementById('nextBtn').addEventListener('click', () => {
  // Switch player
  currentPlayerIndex = currentPlayerIndex === 0 ? 1 : 0;
  roundCount++;

  updateCurrentPlayer();
  updateStats();
  resetChallenge();
});

function updateStats() {
  document.getElementById('roundCount').textContent = roundCount;
  document.getElementById('completedCount').textContent = completedCount;
}

function resetChallenge() {
  document.getElementById('challengeDisplay').style.display = 'none';
  document.getElementById('wheelContainer').style.display = 'block';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('spinBtn').style.display = 'inline-block';
  document.getElementById('spinBtn').disabled = false;
}

// === NEW GAME ===
document.getElementById('newGameBtn').addEventListener('click', () => {
  if (confirm('Start a new game? All progress will be lost.')) {
    location.reload();
  }
});

// === PARTICLES ===
function createParticles(emoji, count = 15) {
  for (let i = 0; i < count; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * window.innerWidth + 'px';
    particle.style.top = window.innerHeight / 2 + 'px';
    particle.style.fontSize = (Math.random() * 25 + 20) + 'px';
    particle.textContent = emoji;
    document.body.appendChild(particle);
    setTimeout(() => particle.remove(), 3000);
  }
}
</script>
</body>
