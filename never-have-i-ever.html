<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naughty Never Have I Ever 🍷</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #2c003e 0%, #5b0a3d 50%, #2c003e 100%);
    color:#fff;
    text-align:center;
    padding:20px;
    min-height:100vh;
  }

  h1 {
    font-size: clamp(36px, 8vw, 64px);
    margin-bottom:10px;
    background: linear-gradient(45deg, #ff006e, #fb5607, #ffbe0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: glow 2s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% {filter: drop-shadow(0 0 15px rgba(255, 0, 110, 0.5));}
    50% {filter: drop-shadow(0 0 30px rgba(255, 0, 110, 0.8));}
  }

  .subtitle {
    font-size: clamp(16px, 3.5vw, 22px);
    color:#fb5607;
    margin-bottom:30px;
    font-style:italic;
  }

  /* Setup Screen */
  #setupScreen {
    max-width:600px;
    margin:50px auto;
    padding:40px;
    background:rgba(255, 0, 110, 0.1);
    border-radius:20px;
    border:2px solid rgba(255, 0, 110, 0.3);
  }

  #setupScreen h2 {
    margin-bottom:30px;
    color:#ff006e;
    font-size: clamp(24px, 5vw, 32px);
  }

  .input-group {
    margin:20px 0;
    text-align:left;
  }

  .input-group label {
    display:block;
    margin-bottom:8px;
    color:#fb5607;
    font-size:clamp(14px, 3vw, 18px);
    font-weight:600;
  }

  .input-group input {
    width:100%;
    padding:14px 18px;
    border:2px solid rgba(255, 0, 110, 0.4);
    border-radius:10px;
    background:rgba(0,0,0,0.5);
    color:#fff;
    font-size:clamp(14px, 3vw, 16px);
  }

  .input-group input:focus {
    outline:none;
    border-color:#fb5607;
    box-shadow:0 0 15px rgba(251, 86, 7, 0.5);
  }

  .category-buttons {
    display:flex;
    gap:12px;
    justify-content:center;
    margin:25px 0;
    flex-wrap:wrap;
  }

  .category-btn {
    padding:12px 24px;
    font-size:clamp(14px, 3vw, 16px);
    border:2px solid rgba(255, 0, 110, 0.4);
    border-radius:10px;
    background:rgba(0,0,0,0.3);
    color:#fff;
    cursor:pointer;
    transition:all 0.3s;
    font-weight:600;
  }

  .category-btn.selected {
    background:#ff006e;
    border-color:#fb5607;
    box-shadow:0 0 20px rgba(255, 0, 110, 0.6);
  }

  /* Game Screen */
  #gameScreen {
    display:none;
    max-width:900px;
    margin:0 auto;
  }

  .game-header {
    display:flex;
    justify-content:space-between;
    padding:20px;
    background:rgba(255, 0, 110, 0.15);
    border-radius:15px;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:15px;
  }

  .stat-box {
    font-size:clamp(14px, 3vw, 18px);
  }

  .stat-box span {
    color:#fb5607;
    font-weight:700;
  }

  .statement-card {
    margin:40px auto;
    padding:50px 40px;
    background:rgba(255, 0, 110, 0.15);
    border-radius:20px;
    border:3px solid rgba(255, 0, 110, 0.4);
    min-height:250px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .statement-text {
    font-size: clamp(24px, 5vw, 36px);
    line-height:1.4;
    color:#fff;
    margin-bottom:30px;
    font-weight:500;
  }

  .statement-prefix {
    font-size: clamp(18px, 4vw, 24px);
    color:#fb5607;
    margin-bottom:15px;
    font-weight:700;
  }

  .player-responses {
    display:flex;
    justify-content:center;
    gap:30px;
    margin:30px 0;
    flex-wrap:wrap;
  }

  .player-card {
    padding:25px;
    background:rgba(0,0,0,0.4);
    border-radius:15px;
    border:2px solid rgba(255, 0, 110, 0.3);
    min-width:200px;
  }

  .player-card.drinks {
    border-color:#fb5607;
    background:rgba(251, 86, 7, 0.2);
  }

  .player-card-name {
    font-size:clamp(16px, 3.5vw, 20px);
    color:#fff;
    margin-bottom:12px;
    font-weight:700;
  }

  .player-card-action {
    font-size:clamp(20px, 4vw, 28px);
    font-weight:900;
  }

  .drinks {
    color:#fb5607;
  }

  .safe {
    color:#06ffa5;
  }

  .response-buttons {
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .response-btn {
    padding:18px 36px;
    font-size:clamp(16px, 3.5vw, 20px);
    border:2px solid;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    transition:all 0.3s;
    min-width:140px;
  }

  .done-btn {
    background:#fb5607;
    border-color:#ff006e;
    color:#fff;
  }

  .done-btn:hover {
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(251, 86, 7, 0.6);
  }

  .safe-btn {
    background:#06ffa5;
    border-color:#06d6a0;
    color:#000;
  }

  .safe-btn:hover {
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(6, 255, 165, 0.6);
  }

  button {
    padding:16px 40px;
    font-size:clamp(14px, 3vw, 18px);
    margin:10px;
    border:2px solid rgba(255, 0, 110, 0.5);
    border-radius:12px;
    background:#ff006e;
    color:#fff;
    cursor:pointer;
    font-weight:700;
    transition:all 0.3s;
  }

  button:disabled {
    opacity:0.5;
    cursor:not-allowed;
  }

  button:not(:disabled):hover {
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(255, 0, 110, 0.6);
  }

  #nextBtn {display:none;}

  @media (max-width: 768px) {
    .game-header {
      flex-direction:column;
      text-align:center;
    }
  }
</style>
</head>
<body>
<div class="content">
<h1>🍷 Naughty Never Have I Ever 🍷</h1>
<p class="subtitle">"Confess or drink - what will it be?"</p>

<!-- Setup Screen -->
<div id="setupScreen">
  <h2>Game Setup</h2>

  <div class="input-group">
    <label for="player1Name">Player 1 Name</label>
    <input type="text" id="player1Name" placeholder="Enter first player...">
  </div>

  <div class="input-group">
    <label for="player2Name">Player 2 Name</label>
    <input type="text" id="player2Name" placeholder="Enter second player...">
  </div>

  <h3 style="margin:25px 0 15px; color:#fb5607;">Select Spice Level:</h3>
  <div class="category-buttons">
    <button class="category-btn" data-category="vanilla">😊 Vanilla</button>
    <button class="category-btn" data-category="spicy">🌶️ Spicy</button>
    <button class="category-btn" data-category="extreme">🔥 Extreme</button>
  </div>

  <button id="startBtn" disabled>Start Game 🍷</button>
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <div class="game-header">
    <div class="stat-box">Round: <span id="roundCount">1</span></div>
    <div class="stat-box" style="color:#fb5607; font-size:clamp(16px,4vw,22px);" id="currentCategory">VANILLA</div>
    <div class="stat-box">Total Drinks: <span id="drinkCount">0</span></div>
  </div>

  <div class="statement-card">
    <div class="statement-prefix">Never Have I Ever...</div>
    <div class="statement-text" id="statementText">Loading...</div>

    <div id="responseSection" style="display:none;">
      <div class="player-responses" id="playerResponses"></div>
    </div>
  </div>

  <div class="response-buttons" id="responseButtons">
    <button class="response-btn done-btn" id="doneItBtn">😏 I've Done It (Drink!)</button>
    <button class="response-btn safe-btn" id="safeBtn">😇 Never Done It (Safe!)</button>
  </div>

  <div style="margin-top:30px;">
    <button id="nextBtn">Next Round ➡️</button>
    <button id="newGameBtn">🔄 New Game</button>
  </div>
</div>
</div>

<script>
// Statements Database
const statements = {
  vanilla: [
    "Had a crush on a friend's partner",
    "Kissed more than one person in the same day",
    "Sent a flirty text to the wrong person",
    "Stalked an ex on social media",
    "Had a sex dream about someone I know",
    "Lied about my body count",
    "Faked being sick to spend time with someone",
    "Had feelings for two people at once",
    "Kissed someone within an hour of meeting them",
    "Went on a date just for the free meal",
    "Had a friends-with-benefits situation",
    "Kissed someone I wasn't attracted to",
    "Had a one-night stand",
    "Hooked up with a coworker",
    "Made out with someone at a party",
  ],

  spicy: [
    "Had sex in a public place",
    "Sent nudes to someone",
    "Had sex on the first date",
    "Used a toy during sex",
    "Watched porn with a partner",
    "Had a threesome",
    "Been tied up or tied someone up",
    "Had sex in a car",
    "Recorded myself during sexual activity",
    "Hooked up with someone the same day we met",
    "Had sex while others were in the room",
    "Used food during foreplay",
    "Been walked in on during sex",
    "Had phone sex",
    "Sexted during work or class",
    "Skinny dipped with someone",
    "Given or received a lap dance",
    "Had sex in the shower",
    "Roleplayed during sex",
    "Been spanked or spanked someone",
  ],

  extreme: [
    "Had sex with more than one person in 24 hours",
    "Participated in group sex",
    "Been to a sex club or swingers party",
    "Had sex while someone watched",
    "Hooked up with someone whose name I didn't know",
    "Had anal sex",
    "Used handcuffs or restraints during sex",
    "Had sex in a completely public place where we could be seen",
    "Cheated on a partner",
    "Been dominated or dominated someone intensely",
    "Had sex with someone for money or gifts",
    "Joined the mile high club",
    "Had sex with more than 3 people in one week",
    "Used a dating app just for hookups",
    "Had a sexual encounter with a stranger",
    "Been to an orgy",
    "Had sex while intoxicated and barely remember it",
    "Fantasized about someone in this room",
    "Had sex somewhere illegal",
    "Done something sexual I'm ashamed of",
  ]
};

// Game State
let player1Name = 'Player 1';
let player2Name = 'Player 2';
let selectedCategory = null;
let roundCount = 1;
let totalDrinks = 0;
let usedStatements = [];
let currentResponses = {player1: null, player2: null};
let responsesSubmitted = 0;

// Category Selection
document.querySelectorAll('.category-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
    this.classList.add('selected');
    selectedCategory = this.getAttribute('data-category');
    document.getElementById('startBtn').disabled = false;
  });
});

// Start Game
document.getElementById('startBtn').addEventListener('click', () => {
  const p1 = document.getElementById('player1Name').value.trim();
  const p2 = document.getElementById('player2Name').value.trim();

  player1Name = p1 || 'Player 1';
  player2Name = p2 || 'Player 2';

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('currentCategory').textContent = selectedCategory.toUpperCase();

  loadStatement();
});

// Load Statement
function loadStatement() {
  const categoryStatements = statements[selectedCategory];

  // Reset if all used
  if (usedStatements.length >= categoryStatements.length) {
    usedStatements = [];
  }

  // Get unused statement
  let available = categoryStatements.filter((s, i) => !usedStatements.includes(i));
  let randomStatement = available[Math.floor(Math.random() * available.length)];
  let index = categoryStatements.indexOf(randomStatement);
  usedStatements.push(index);

  document.getElementById('statementText').textContent = randomStatement;
  document.getElementById('responseSection').style.display = 'none';
  document.getElementById('responseButtons').style.display = 'flex';
  document.getElementById('nextBtn').style.display = 'none';

  currentResponses = {player1: null, player2: null};
  responsesSubmitted = 0;
}

// Response Buttons
document.getElementById('doneItBtn').addEventListener('click', () => {
  handleResponse('done');
});

document.getElementById('safeBtn').addEventListener('click', () => {
  handleResponse('safe');
});

function handleResponse(response) {
  if (responsesSubmitted === 0) {
    currentResponses.player1 = response;
    responsesSubmitted++;
    alert(`${player1Name}'s answer recorded! Now ${player2Name}'s turn...`);
  } else if (responsesSubmitted === 1) {
    currentResponses.player2 = response;
    responsesSubmitted++;
    revealResponses();
  }
}

function revealResponses() {
  document.getElementById('responseButtons').style.display = 'none';
  document.getElementById('responseSection').style.display = 'block';
  document.getElementById('nextBtn').style.display = 'inline-block';

  let drinks = 0;
  if (currentResponses.player1 === 'done') drinks++;
  if (currentResponses.player2 === 'done') drinks++;

  totalDrinks += drinks;
  updateStats();

  const responsesHTML = `
    <div class="player-card ${currentResponses.player1 === 'done' ? 'drinks' : ''}">
      <div class="player-card-name">${player1Name}</div>
      <div class="player-card-action ${currentResponses.player1 === 'done' ? 'drinks' : 'safe'}">
        ${currentResponses.player1 === 'done' ? '🍺 DRINKS!' : '✅ SAFE!'}
      </div>
    </div>
    <div class="player-card ${currentResponses.player2 === 'done' ? 'drinks' : ''}">
      <div class="player-card-name">${player2Name}</div>
      <div class="player-card-action ${currentResponses.player2 === 'done' ? 'drinks' : 'safe'}">
        ${currentResponses.player2 === 'done' ? '🍺 DRINKS!' : '✅ SAFE!'}
      </div>
    </div>
  `;

  document.getElementById('playerResponses').innerHTML = responsesHTML;
}

// Next Round
document.getElementById('nextBtn').addEventListener('click', () => {
  roundCount++;
  updateStats();
  loadStatement();
});

// Update Stats
function updateStats() {
  document.getElementById('roundCount').textContent = roundCount;
  document.getElementById('drinkCount').textContent = totalDrinks;
}

// New Game
document.getElementById('newGameBtn').addEventListener('click', () => {
  if (confirm('Start a new game? All progress will be lost.')) {
    location.reload();
  }
});
</script>
</body>
</html>
