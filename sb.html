  #board {

    margin:20px auto;

    grid-auto-rows:minmax(70px, auto);
    gap:clamp(4px, 1vw, 8px);

    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

    mask-composite: exclude;
    opacity:0.6;
    pointer-events:none;
  }

  .space {
    width:100%;
    aspect-ratio:1;
    padding:clamp(6px, 1.5vw, 12px);
    border-radius:12px;
    font-size:clamp(8px, 1.5vw, 12px);

    left:5px;

    opacity:0.5;
    font-weight:bold;
    background:rgba(0,0,0,0.3);
    padding:2px 4px;
    border-radius:4px;
  }

  .space::after {
    content:'';
    position:absolute;
    background:linear-gradient(90deg,
      transparent 0%,
      rgba(255,107,53,0.4) 20%,
      rgba(255,107,53,0.6) 50%,
      rgba(255,107,53,0.4) 80%,
      transparent 100%);
    height:4px;
    width:calc(100% + clamp(4px, 1vw, 8px));
    top:50%;
    right:-clamp(4px, 1vw, 8px);
    transform:translateY(-50%);
    z-index:-1;
  }

  .space:nth-child(10n)::after,
  .space:last-child::after {
    display:none;
  }

               inset 0 2px 4px rgba(255,255,255,0.2),
               0 0 0 3px rgba(0,0,0,0.6),
               0 0 0 6px rgba(255,107,53,0.5),
               0 0 30px rgba(255,107,53,0.6);

  .green {

  #card {

    overflow:hidden;

  #card::before {
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg,
      transparent,
      rgba(255,255,255,0.1),
      transparent);
    animation:cardShine 3s infinite;

  @keyframes cardShine {
    0% {left:-100%;}
    50%, 100% {left:100%;}
  }

  @keyframes cardSlideIn {
    from {opacity:0; transform:translateY(-20px);}
    to {opacity:1; transform:translateY(0);}
  }

    font-weight:bold;
    color:#8b0000;
    box-shadow:0 10px 30px rgba(0,0,0,0.7);

    0% {transform:rotateX(0deg) rotateY(0deg) scale(1);}
    25% {transform:rotateX(180deg) rotateY(180deg) scale(1.2);}
    50% {transform:rotateX(360deg) rotateY(360deg) scale(1);}
    75% {transform:rotateX(540deg) rotateY(540deg) scale(1.2);}
    100% {transform:rotateX(720deg) rotateY(720deg) scale(1);}

  .timer-bar {

    overflow:hidden;
    margin:10px 0;

  .timer-fill {

    transition:width 1s linear;
    border-radius:10px;
    box-shadow:0 0 20px rgba(255,255,0,0.8);

    left:50%;

    height:0;
    border-radius:50%;
    background:rgba(255,255,255,0.2);
    transform:translate(-50%, -50%);
    transition:width 0.6s, height 0.6s;
    z-index:0;
  }

  button:hover {

    box-shadow:0 10px 35px rgba(0,0,0,0.8),
               inset 0 1px 3px rgba(255,255,255,0.3);
  }

  button:active {

  #beginBtn {background:linear-gradient(135deg, #ff6b35 0%, #ff006e 100%); color:#fff;}
  #rollBtn {background:linear-gradient(135deg, #ffff00 0%, #ffa500 100%); color:#000;}

  #saveBtn, #loadBtn {background:linear-gradient(135deg, #4a90e2 0%, #357abd 100%); color:#fff; padding:10px 20px; font-size:14px;}

  /* Particles */
  .particle {

  @keyframes float {

  }

  /* Mobile Optimization */
  @media (max-width: 768px) {

    .space {padding:4px; font-size:9px; line-height:1.1;}

  }

  @media (max-width: 480px) {

  }

  .btn-group {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:10px 0;
  }
</style>

// Shuffle function (Fisher-Yates algorithm)
function shuffleArray(array) {
  const shuffled = [...array]; // Create a copy
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

// Initialize shuffled decks

// === BUILD BOARD ===

    else if (txt.includes("Tease") && !txt.includes("→")) div.classList.add("green");
    else if (txt.includes("Heat") && !txt.includes("→")) div.classList.add("orange");
    else if (txt.includes("Fire") && !txt.includes("→")) div.classList.add("red");

    if (txt.includes("Checkpoint") || txt.includes("Both")) div.classList.add("checkpoint");
    if (txt==="start") div.classList.add("start");
    if (txt==="finish") div.classList.add("finish");

    // Add emoji icons for special tiles
    let displayText = txt;
    if (txt.includes("Remove 1")) displayText = "👕<br>Remove 1";
    else if (txt.includes("Remove 2")) displayText = "👕👗<br>Remove 2";
    else if (txt.includes("Add 1")) displayText = "👔<br>Add 1";

    else if (txt.includes("Heart")) displayText = "💕<br>" + txt;

    else if (txt.includes("→")) displayText = "🔥<br>" + txt.replace("→"," → ");
    else if (txt.includes("Spank")) displayText = "👋<br>" + txt;

    div.innerHTML = displayText;
    div.dataset.index = i;
    if (i===p1) div.classList.add("player1");
    if (i===p2) div.classList.add("player2");
    boardEl.appendChild(div);
  });
}

// === TIMER ===
function startTimer(seconds, callback) {
  let time = seconds;
  const totalTime = seconds;
  document.getElementById("timer").textContent = `${time}s`;
  document.getElementById("timerFill").style.width = "100%";

  timerInterval = setInterval(() => {
    time--;
    document.getElementById("timer").textContent = `${time}s`;
    const percentage = (time / totalTime) * 100;
    document.getElementById("timerFill").style.width = percentage + "%";

    if (time <= 0) {
      clearInterval(timerInterval);
      document.getElementById("timer").textContent = "";
      document.getElementById("timerFill").style.width = "0%";
      createParticles("✨", 20);
      callback();
    }
  }, 1000);
}

  p2 = lastState.p2;

  document.getElementById("card").innerHTML = `Move undone! ${currentPlayer === 1 ? player1Name : player2Name}'s turn`;
