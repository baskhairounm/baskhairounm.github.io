    justify-content:center;

  }
</style>

  }
}

// === TIMER ===
function startTimer(seconds, callback) {
  let time = seconds;
  const totalTime = seconds;
  document.getElementById("timer").textContent = `${time}s`;
  document.getElementById("timerFill").style.width = "100%";

  timerInterval = setInterval(() => {
    time--;
    document.getElementById("timer").textContent = `${time}s`;
    const percentage = (time / totalTime) * 100;
    document.getElementById("timerFill").style.width = percentage + "%";

    if (time <= 0) {
      clearInterval(timerInterval);
      document.getElementById("timer").textContent = "";
      document.getElementById("timerFill").style.width = "0%";
      createParticles("✨", 20);
      callback();
    }
  }, 1000);
}

// === UPDATE POSITIONS ===
function updatePositions() {
  document.getElementById("positions").textContent = `${player1Name}: space ${p1} | ${player2Name}: space ${p2}`;
}

// === SAVE/LOAD ===
function saveGame() {
  const gameState = {
    p1, p2, currentPlayer, player1Name, player2Name, gameHistory
  };
  localStorage.setItem("slowBurnSave", JSON.stringify(gameState));
  alert("Game saved! 💾");
}

function loadGame() {
  const saved = localStorage.getItem("slowBurnSave");
  if (!saved) {
    alert("No saved game found!");
    return;
  }
  const gameState = JSON.parse(saved);
  p1 = gameState.p1;
  p2 = gameState.p2;
  currentPlayer = gameState.currentPlayer;
  player1Name = gameState.player1Name || "Player 1";
  player2Name = gameState.player2Name || "Player 2";
  gameHistory = gameState.gameHistory || [];

  document.getElementById("setupScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("rollBtn").style.display = "inline-block";
  document.getElementById("undoBtn").style.display = gameHistory.length > 0 ? "inline-block" : "none";

  buildBoard();
  updatePositions();
  document.getElementById("card").innerHTML = `Game loaded! ${currentPlayer === 1 ? player1Name : player2Name}'s turn`;
  alert("Game loaded! 📂");
}

// === UNDO ===
function undoMove() {
  if (gameHistory.length === 0) {
    alert("No moves to undo!");
    return;
  }
  const lastState = gameHistory.pop();
  p1 = lastState.p1;
  p2 = lastState.p2;
  currentPlayer = lastState.currentPlayer;
  buildBoard();
  updatePositions();
  document.getElementById("card").innerHTML = `Move undone! ${currentPlayer === 1 ? player1Name : player2Name}'s turn`;
  document.getElementById("rollBtn").style.display = "inline-block";
  document.getElementById("nextBtn").style.display = "none";
  if (gameHistory.length === 0) {
    document.getElementById("undoBtn").style.display = "none";
  }
}

// === GAME FLOW ===
document.getElementById("rollBtn").onclick = () => {
  // Save state before move
  gameHistory.push({p1, p2, currentPlayer});
  document.getElementById("undoBtn").style.display = "inline-block";

  const roll = Math.floor(Math.random()*6)+1;
  showDice(roll);
  createParticles("🎲", 10);

  const playerName = currentPlayer === 1 ? player1Name : player2Name;
  document.getElementById("card").innerHTML = `${playerName} rolled ${roll}! Moving...`;
  document.getElementById("rollBtn").style.display = "none";

  if (currentPlayer===1) { p1 = Math.min(p1+roll, board.length-1); }
  else { p2 = Math.min(p2+roll, board.length-1); }

  setTimeout(() => {
    buildBoard();
    updatePositions();
  }, 400);

  setTimeout(() => {
    const pos = currentPlayer===1 ? p1 : p2;
    const action = landOn(pos);
    document.getElementById("card").innerHTML = action;

    // Particle effects based on zone or tile type
    if (action.includes("Remove")) {
      createParticles("👕", 15);
      createParticles("🔥", 10);
    } else if (action.includes("Add 1")) {
      createParticles("👔", 10);
      createParticles("😅", 8);
    } else if (action.includes("Take a shot")) {
      createParticles("🥃", 15);
      createParticles("🍺", 10);
    } else if (action.includes("Go back")) {
      createParticles("⬅️", 15);
      createParticles("😱", 10);
    } else if (pos < 16) {
      createParticles("💚", 10);
    } else if (pos < 32) {
      createParticles("🧡", 15);
    } else {
      createParticles("🔥", 20);
    }

    if (action.includes("minute") || action.includes("seconds") || action.includes("90 seconds")) {
      const secs = action.includes("5 minute") ? 300 : action.includes("3 minute") ? 180 : action.includes("2 minute") ? 120 : action.includes("90 seconds") ? 90 : action.includes("45 seconds") ? 45 : 60;
      startTimer(secs, () => {
        document.getElementById("nextBtn").style.display = "inline-block";
      });
      document.getElementById("nextBtn").style.display = "none";
    } else {
      document.getElementById("nextBtn").style.display = "inline-block";
    }

    if (p1 >= board.length-1 && p2 >= board.length-1) {
      document.getElementById("card").innerHTML = `<h2>🔥 IGNITE 🔥<br><br>Both ${player1Name} and ${player2Name} reached the end!<br><br>Finish exactly how you want.<br><br>Game over when you both climax together.</h2>`;
      document.getElementById("rollBtn").style.display = "none";
      document.getElementById("nextBtn").style.display = "none";
      createParticles("🔥", 50);
    }
  }, 1500);
};

document.getElementById("nextBtn").onclick = () => {
  currentPlayer = currentPlayer===1 ? 2 : 1;
  const playerName = currentPlayer === 1 ? player1Name : player2Name;
  document.getElementById("card").innerHTML = `${playerName}'s turn – Roll the dice! 🎲`;
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("rollBtn").style.display = "inline-block";
  updatePositions();
};

document.getElementById("undoBtn").onclick = undoMove;
document.getElementById("saveBtn").onclick = saveGame;
document.getElementById("loadBtn").onclick = loadGame;

buildBoard();
</script>
</body>
</html>
