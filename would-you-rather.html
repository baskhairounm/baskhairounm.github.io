<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Would You Rather: After Hours 🤔</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    color:#fff;
    text-align:center;
    padding:20px;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* Animated Background */
  .stars {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
  }

  .star {
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 3s infinite;
  }

  @keyframes twinkle {
    0%, 100% {opacity:0;}
    50% {opacity:1;}
  }

  .content {
    position:relative;
    z-index:1;
  }

  h1 {
    font-size: clamp(36px, 8vw, 64px);
    margin-bottom:10px;
    background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #667eea);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    background-size: 200% auto;
    animation: gradientShift 3s ease infinite;
    filter: drop-shadow(0 0 20px rgba(118, 75, 162, 0.5));
  }

  @keyframes gradientShift {
    0%, 100% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
  }

  .subtitle {
    font-size: clamp(16px, 3.5vw, 22px);
    color:#f093fb;
    margin-bottom:30px;
    opacity:0.9;
    font-style:italic;
  }

  /* Setup Screen */
  #setupScreen {
    max-width:600px;
    margin:50px auto;
    padding:50px;
    background:linear-gradient(135deg,
      rgba(102, 126, 234, 0.1) 0%,
      rgba(118, 75, 162, 0.1) 100%);
    border-radius:30px;
    border:3px solid rgba(102, 126, 234, 0.4);
    backdrop-filter:blur(20px);
    box-shadow:0 20px 80px rgba(118, 75, 162, 0.3),
               inset 0 0 50px rgba(102, 126, 234, 0.05);
  }

  #setupScreen h2 {
    margin-bottom:30px;
    color:#667eea;
    text-shadow:0 0 20px rgba(102, 126, 234, 0.8);
    font-size: clamp(28px, 6vw, 36px);
  }

  .input-group {
    margin:25px 0;
    text-align:left;
  }

  .input-group label {
    display:block;
    margin-bottom:10px;
    color:#f093fb;
    font-size:clamp(16px, 3.5vw, 20px);
    font-weight:600;
  }

  .input-group input {
    width:100%;
    padding:16px 20px;
    border:2px solid rgba(102, 126, 234, 0.5);
    border-radius:12px;
    background:rgba(0,0,0,0.6);
    color:#fff;
    font-size:clamp(16px, 3.5vw, 18px);
    transition:0.3s;
  }

  .input-group input:focus {
    outline:none;
    border-color:#f093fb;
    box-shadow:0 0 20px rgba(240, 147, 251, 0.6);
  }

  .category-select {
    margin:30px 0;
  }

  .category-select h3 {
    color:#f093fb;
    margin-bottom:20px;
    font-size:clamp(18px, 4vw, 24px);
  }

  .category-buttons {
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    justify-content:center;
  }

  .category-btn {
    padding:15px 30px;
    font-size:clamp(14px, 3vw, 18px);
    border:2px solid rgba(102, 126, 234, 0.5);
    border-radius:12px;
    background:rgba(0,0,0,0.3);
    color:#fff;
    cursor:pointer;
    transition:all 0.3s ease;
    font-weight:600;
  }

  .category-btn.selected {
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-color:#f093fb;
    box-shadow:0 0 20px rgba(102, 126, 234, 0.6);
  }

  .category-btn:hover {
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(102, 126, 234, 0.4);
  }

  /* Game Screen */
  #gameScreen {
    display:none;
    max-width:1200px;
    margin:0 auto;
  }

  .game-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:30px;
    padding:20px 30px;
    background:linear-gradient(135deg,
      rgba(102, 126, 234, 0.15) 0%,
      rgba(118, 75, 162, 0.15) 100%);
    border-radius:20px;
    border:2px solid rgba(102, 126, 234, 0.4);
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }

  .stat-box {
    font-size:clamp(14px, 3vw, 18px);
    font-weight:600;
  }

  .stat-box span {
    color:#f093fb;
    font-weight:700;
    font-size:clamp(16px, 3.5vw, 22px);
  }

  .category-badge {
    padding:10px 25px;
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius:25px;
    font-size:clamp(14px, 3vw, 18px);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
  }

  /* Question Display */
  .question-container {
    margin:40px auto;
    max-width:1000px;
  }

  .question-header {
    font-size:clamp(24px, 5vw, 36px);
    color:#f093fb;
    margin-bottom:40px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:2px;
  }

  .options-container {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    margin-bottom:40px;
  }

  .option-card {
    padding:40px 30px;
    background:linear-gradient(135deg,
      rgba(102, 126, 234, 0.15) 0%,
      rgba(118, 75, 162, 0.15) 100%);
    border-radius:25px;
    border:3px solid rgba(102, 126, 234, 0.4);
    cursor:pointer;
    transition:all 0.3s ease;
    position:relative;
    overflow:hidden;
    min-height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .option-card::before {
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg,
      transparent,
      rgba(255,255,255,0.2),
      transparent);
    transition:left 0.5s;
  }

  .option-card:hover::before {
    left:100%;
  }

  .option-card:hover {
    transform:translateY(-10px);
    border-color:#f093fb;
    box-shadow:0 20px 60px rgba(102, 126, 234, 0.6),
               0 0 40px rgba(240, 147, 251, 0.4);
  }

  .option-card.selected {
    background:linear-gradient(135deg,
      rgba(102, 126, 234, 0.3) 0%,
      rgba(118, 75, 162, 0.3) 100%);
    border-color:#f093fb;
    box-shadow:0 0 40px rgba(240, 147, 251, 0.8);
  }

  .option-letter {
    position:absolute;
    top:15px;
    left:20px;
    font-size:clamp(32px, 6vw, 48px);
    font-weight:900;
    color:#667eea;
    opacity:0.3;
  }

  .option-text {
    font-size:clamp(18px, 4vw, 24px);
    line-height:1.5;
    color:#fff;
    font-weight:500;
    padding:0 20px;
  }

  /* Answer Section */
  .answer-section {
    margin:40px auto;
    padding:30px;
    max-width:900px;
    background:linear-gradient(135deg,
      rgba(102, 126, 234, 0.1) 0%,
      rgba(118, 75, 162, 0.1) 100%);
    border-radius:20px;
    border:2px solid rgba(102, 126, 234, 0.3);
    display:none;
  }

  .answer-section.show {
    display:block;
    animation:slideIn 0.5s ease;
  }

  @keyframes slideIn {
    from {opacity:0; transform:translateY(-30px);}
    to {opacity:1; transform:translateY(0);}
  }

  .answer-label {
    font-size:clamp(18px, 4vw, 24px);
    color:#f093fb;
    margin-bottom:15px;
    font-weight:700;
  }

  .answer-display {
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:30px;
  }

  .player-answer {
    padding:20px 30px;
    background:rgba(102, 126, 234, 0.2);
    border-radius:15px;
    border:2px solid rgba(102, 126, 234, 0.5);
    min-width:200px;
  }

  .player-name {
    font-size:clamp(14px, 3vw, 18px);
    color:#667eea;
    margin-bottom:10px;
    font-weight:700;
  }

  .player-choice {
    font-size:clamp(16px, 3.5vw, 22px);
    color:#fff;
    font-weight:600;
  }

  .discussion-prompt {
    margin-top:20px;
    padding:20px;
    background:rgba(240, 147, 251, 0.1);
    border-radius:12px;
    border-left:4px solid #f093fb;
  }

  .discussion-prompt p {
    font-size:clamp(14px, 3vw, 18px);
    color:#ddd;
    line-height:1.6;
    font-style:italic;
  }

  /* Buttons */
  button {
    padding:clamp(16px, 3vw, 20px) clamp(32px, 6vw, 60px);
    font-size:clamp(16px, 3.5vw, 22px);
    margin:15px;
    border:3px solid rgba(102, 126, 234, 0.5);
    border-radius:15px;
    cursor:pointer;
    font-weight:700;
    transition:all 0.3s ease;
    box-shadow:0 8px 30px rgba(0,0,0,0.6);
    text-transform:uppercase;
    letter-spacing:1.5px;
    position:relative;
    overflow:hidden;
  }

  button:disabled {
    opacity:0.5;
    cursor:not-allowed;
  }

  button::before {
    content:'';
    position:absolute;
    top:50%;
    left:50%;
    width:0;
    height:0;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    transform:translate(-50%, -50%);
    transition:width 0.6s, height 0.6s;
    z-index:-1;
  }

  button:not(:disabled):hover::before {
    width:350px;
    height:350px;
  }

  button:not(:disabled):hover {
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 15px 50px rgba(102, 126, 234, 0.8);
  }

  #startBtn {background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:#fff;}
  #revealBtn {background:linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color:#fff; display:none;}
  #nextBtn {background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color:#fff; display:none;}
  #newGameBtn {background:linear-gradient(135deg, #666 0%, #999 100%); color:#fff;}
  #backBtn {background:linear-gradient(135deg, #555 0%, #888 100%); color:#fff;}

  /* Mobile Responsive */
  @media (max-width: 768px) {
    .options-container {
      grid-template-columns:1fr;
      gap:20px;
    }

    .game-header {
      flex-direction:column;
      text-align:center;
    }

    .answer-display {
      flex-direction:column;
    }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="content">
<h1>🤔 Would You Rather: After Hours 🤔</h1>
<p class="subtitle">"Explore desires and discover fantasies together"</p>

<!-- Setup Screen -->
<div id="setupScreen">
  <h2>Game Setup</h2>

  <div class="input-group">
    <label for="player1Name">Player 1 Name</label>
    <input type="text" id="player1Name" placeholder="Enter first player..." maxlength="20">
  </div>

  <div class="input-group">
    <label for="player2Name">Player 2 Name</label>
    <input type="text" id="player2Name" placeholder="Enter second player..." maxlength="20">
  </div>

  <div class="category-select">
    <h3>Select Category:</h3>
    <div class="category-buttons">
      <button class="category-btn" data-category="mild">😊 Mild</button>
      <button class="category-btn" data-category="spicy">🌶️ Spicy</button>
      <button class="category-btn" data-category="wild">🔥 Wild</button>
    </div>
  </div>

  <button id="startBtn" disabled>Begin the Game 🚀</button>
</div>

<!-- Game Screen -->
<div id="gameScreen">
  <div class="game-header">
    <div class="stat-box">Question: <span id="questionCount">1</span></div>
    <div class="category-badge" id="currentCategory">MILD</div>
    <div class="stat-box">Answered: <span id="answeredCount">0</span></div>
  </div>

  <div class="question-container">
    <div class="question-header">Would You Rather...</div>

    <div class="options-container" id="optionsContainer">
      <div class="option-card" data-option="A">
        <div class="option-letter">A</div>
        <div class="option-text" id="optionA">Loading...</div>
      </div>
      <div class="option-card" data-option="B">
        <div class="option-letter">B</div>
        <div class="option-text" id="optionB">Loading...</div>
      </div>
    </div>

    <div class="answer-section" id="answerSection">
      <div class="answer-label">Both Players Chose:</div>
      <div class="answer-display" id="answerDisplay"></div>

      <div class="discussion-prompt">
        <p id="discussionPrompt">Take a moment to discuss why you chose your answer and explore each other's thoughts...</p>
      </div>
    </div>
  </div>

  <div style="margin-top:40px;">
    <button id="revealBtn">💭 Reveal Answers</button>
    <button id="nextBtn">Next Question ➡️</button>
    <button id="newGameBtn">🔄 New Game</button>
    <button id="backBtn">⬅️ Back to Setup</button>
  </div>
</div>
</div>

<script>
// Generate stars
function createStars() {
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 100; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
  }
}
createStars();

// Questions Database
const questions = {
  mild: [
    {a: "Have a romantic candlelit dinner at home", b: "Go out for a fancy restaurant date", discussion: "What makes each setting special for you?"},
    {a: "Receive a long sensual massage", b: "Give your partner a long sensual massage", discussion: "Do you prefer giving or receiving affection?"},
    {a: "Kiss in the rain", b: "Kiss under the stars", discussion: "What's your most romantic kiss memory?"},
    {a: "Slow dance in your living room", b: "Dance together at a club", discussion: "How does music affect your mood for romance?"},
    {a: "Cuddle while watching a movie", b: "Take a bubble bath together", discussion: "What helps you feel most connected?"},
    {a: "Wake up to breakfast in bed", b: "Fall asleep to a bedtime story", discussion: "What small gestures mean the most to you?"},
    {a: "Share your deepest fear", b: "Share your biggest dream", discussion: "How does vulnerability bring you closer?"},
    {a: "Hold hands everywhere you go for a week", b: "Kiss every time you see each other for a week", discussion: "What public displays of affection do you enjoy?"},
    {a: "Write love letters to each other", b: "Record video messages for each other", discussion: "How do you best express your feelings?"},
    {a: "Spend a day doing your partner's favorite activities", b: "Introduce your partner to something new you love", discussion: "How do you balance individual interests in a relationship?"},
  ],

  spicy: [
    {a: "Be teased all day without release", b: "Have multiple quick sessions", discussion: "What kind of buildup excites you most?"},
    {a: "Try a new position you've been curious about", b: "Perfect your favorite position", discussion: "What makes something exciting in the bedroom?"},
    {a: "Have sex in a semi-public place", b: "Record yourselves for private viewing", discussion: "What kind of risks turn you on?"},
    {a: "Be dominant for a week", b: "Be submissive for a week", discussion: "How does power dynamic affect your desire?"},
    {a: "Receive oral for 30 minutes straight", b: "Give oral until your partner can't take anymore", discussion: "What do you love most about oral?"},
    {a: "Use toys together", b: "Use only hands and mouth", discussion: "How do different sensations affect your pleasure?"},
    {a: "Have slow, passionate sex", b: "Have rough, intense sex", discussion: "What mood determines what you want?"},
    {a: "Be blindfolded during sex", b: "Have your hands tied during sex", discussion: "What about giving up control excites you?"},
    {a: "Whisper dirty talk", b: "Moan and make loud noises", discussion: "How does verbal expression affect your arousal?"},
    {a: "Morning sex every day for a week", b: "Late night sex every day for a week", discussion: "When do you feel most sexually energized?"},
    {a: "Shower together before sex", b: "Get sweaty and primal", discussion: "What kind of preparation turns you on?"},
    {a: "Lots of foreplay", b: "Jump right into it", discussion: "How important is the buildup to you?"},
    {a: "Lights on to watch each other", b: "Lights off to focus on sensation", discussion: "How do your senses affect pleasure?"},
    {a: "Try roleplay", b: "Just be yourselves intensified", discussion: "What fantasies have you always wanted to explore?"},
    {a: "Be the only one naked", b: "Both partially clothed", discussion: "How does clothing affect the experience?"},
  ],

  wild: [
    {a: "Have a threesome with someone you choose", b: "Watch your partner with someone else", discussion: "What boundaries are important to you in fantasy vs reality?"},
    {a: "Try anal play", b: "Try edging/orgasm control", discussion: "What unexplored territory interests you most?"},
    {a: "Go to a sex club together", b: "Attend a private kink party", discussion: "What public exploration appeals to you?"},
    {a: "Let your partner film you solo", b: "Make a sex tape together", discussion: "What about being watched or recorded turns you on?"},
    {a: "Be spanked until you beg", b: "Spank your partner until they beg", discussion: "How do you feel about pain mixed with pleasure?"},
    {a: "Use a remote-controlled toy in public", b: "Have sex somewhere you could get caught", discussion: "What level of risk excites you?"},
    {a: "Be tied up and teased for an hour", b: "Edge your partner repeatedly without letting them finish", discussion: "How does control and denial affect desire?"},
    {a: "Have your partner use you for their pleasure", b: "Use your partner purely for your pleasure", discussion: "What does selfish pleasure do for you?"},
    {a: "Try wax play or temperature play", b: "Try sensory deprivation (blindfold, earplugs, etc.)", discussion: "What intense sensations intrigue you?"},
    {a: "Fulfill your partner's darkest fantasy", b: "Have your partner fulfill yours", discussion: "What's the fantasy you've been too nervous to share?"},
    {a: "Join the mile high club", b: "Have sex in a changing room", discussion: "What taboo locations appeal to you?"},
    {a: "Experiment with consensual degradation", b: "Experiment with intense praise/worship", discussion: "How do words affect your arousal?"},
    {a: "Try breath play (safely)", b: "Try impact play (spanking, flogging)", discussion: "What edge play interests you with proper safety?"},
    {a: "Have multiple partners worship you", b: "Worship your partner with others", discussion: "What group dynamic fantasies do you have?"},
    {a: "Give up all control for an entire session", b: "Take complete control for an entire session", discussion: "What's your ultimate power dynamic fantasy?"},
  ]
};

// Game State
let player1Name = 'Player 1';
let player2Name = 'Player 2';
let selectedCategory = null;
let currentQuestionIndex = 0;
let questionCount = 1;
let answeredCount = 0;
let usedQuestions = [];
let player1Choice = null;
let player2Choice = null;

// Category Selection
document.querySelectorAll('.category-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
    this.classList.add('selected');
    selectedCategory = this.getAttribute('data-category');
    document.getElementById('startBtn').disabled = false;
  });
});

// Start Game
document.getElementById('startBtn').addEventListener('click', () => {
  if (!selectedCategory) return;

  const p1 = document.getElementById('player1Name').value.trim();
  const p2 = document.getElementById('player2Name').value.trim();

  player1Name = p1 || 'Player 1';
  player2Name = p2 || 'Player 2';

  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('currentCategory').textContent = selectedCategory.toUpperCase();

  loadQuestion();
});

// Load Question
function loadQuestion() {
  const categoryQuestions = questions[selectedCategory];

  // Reset if all questions used
  if (usedQuestions.length >= categoryQuestions.length) {
    usedQuestions = [];
  }

  // Get unused question
  let availableQuestions = categoryQuestions.filter((q, i) => !usedQuestions.includes(i));
  let randomIndex = Math.floor(Math.random() * availableQuestions.length);
  let question = availableQuestions[randomIndex];
  currentQuestionIndex = categoryQuestions.indexOf(question);
  usedQuestions.push(currentQuestionIndex);

  // Display question
  document.getElementById('optionA').textContent = question.a;
  document.getElementById('optionB').textContent = question.b;

  // Reset selections
  player1Choice = null;
  player2Choice = null;
  document.querySelectorAll('.option-card').forEach(card => {
    card.classList.remove('selected');
  });
  document.getElementById('answerSection').classList.remove('show');
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
}

// Option Selection
document.querySelectorAll('.option-card').forEach(card => {
  card.addEventListener('click', function() {
    const option = this.getAttribute('data-option');

    // Toggle selection
    if (this.classList.contains('selected')) {
      this.classList.remove('selected');
      if (player1Choice === option) player1Choice = null;
      else if (player2Choice === option) player2Choice = null;
    } else {
      // Select option
      if (!player1Choice) {
        player1Choice = option;
        this.classList.add('selected');
      } else if (!player2Choice && player1Choice !== option) {
        player2Choice = option;
        this.classList.add('selected');
      } else if (!player2Choice) {
        // Both players can choose the same option
        player2Choice = option;
        this.classList.add('selected');
      }
    }

    // Show reveal button when both players selected
    if (player1Choice && player2Choice) {
      document.getElementById('revealBtn').style.display = 'inline-block';
    } else {
      document.getElementById('revealBtn').style.display = 'none';
    }
  });
});

// Reveal Answers
document.getElementById('revealBtn').addEventListener('click', () => {
  answeredCount++;
  updateStats();

  const question = questions[selectedCategory][currentQuestionIndex];
  const answerDisplay = document.getElementById('answerDisplay');

  const p1Text = player1Choice === 'A' ? question.a : question.b;
  const p2Text = player2Choice === 'A' ? question.a : question.b;

  answerDisplay.innerHTML = `
    <div class="player-answer">
      <div class="player-name">${player1Name}</div>
      <div class="player-choice">${player1Choice}: ${p1Text}</div>
    </div>
    <div class="player-answer">
      <div class="player-name">${player2Name}</div>
      <div class="player-choice">${player2Choice}: ${p2Text}</div>
    </div>
  `;

  document.getElementById('discussionPrompt').textContent = question.discussion;
  document.getElementById('answerSection').classList.add('show');
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
});

// Next Question
document.getElementById('nextBtn').addEventListener('click', () => {
  questionCount++;
  updateStats();
  loadQuestion();
});

// Update Stats
function updateStats() {
  document.getElementById('questionCount').textContent = questionCount;
  document.getElementById('answeredCount').textContent = answeredCount;
}

// New Game
document.getElementById('newGameBtn').addEventListener('click', () => {
  if (confirm('Start a new game? All progress will be lost.')) {
    location.reload();
  }
});

// Back to Setup
document.getElementById('backBtn').addEventListener('click', () => {
  if (confirm('Return to category selection? Current game will be lost.')) {
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('setupScreen').style.display = 'block';
    questionCount = 1;
    answeredCount = 0;
    usedQuestions = [];
    updateStats();
  }
});
</script>
